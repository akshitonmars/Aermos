name: Build Aermos APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Aermos Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Aermos
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Android debug keystore
        shell: bash
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Verify build files
        shell: bash
        run: |
          test -f "settings.gradle.kts"
          test -f "build.gradle.kts"
          test -f "app/build.gradle.kts"
          test -f "debug.keystore"

      - name: Build Aermos debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Searching for generated APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "Aermos APK successfully generated:"
          ls -lh "$APK"

      - name: Upload Aermos APK
        uses: actions/upload-artifact@v4
        with:
          name: Aermos-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error